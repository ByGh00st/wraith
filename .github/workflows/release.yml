name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # Build and validate artifacts without publishing a release.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir -p target
          cargo metadata --locked --no-deps --format-version 1 > target/release-metadata.json
          version=$(python3 scripts/check-release.py target/release-metadata.json "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash -n install.sh build.sh scripts/package-release.sh .github/musl-rustc-wrapper.sh
          python3 scripts/test-install.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            libc: gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            libc: gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            libc: musl
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            libc: musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      WRAITH_RELEASE_TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Add 4 GiB swap on this disposable runner
        run: |
          swapfile="$RUNNER_TEMP/wraith-release.swap"
          test ! -e "$swapfile"
          sudo fallocate -l 4G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Install native GNU build and packaging tools
        if: matrix.libc == 'gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl libclang-dev pkg-config libssl-dev dpkg-dev
          cargo install cargo-deb --version 3.8.0 --locked -j 2
      - name: Check and test the native GNU target
        if: matrix.libc == 'gnu'
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and validate GNU binary and Debian package
        if: matrix.libc == 'gnu'
        run: |
          cargo build --release --locked -j 2 -p wraith-cli --target "$TARGET"
          bash scripts/package-release.sh "$TARGET"
      - name: Build and validate native static musl archive
        if: matrix.libc == 'musl'
        run: |
          docker build -f .github/Dockerfile.musl --build-arg BUILDER_UID="$(id -u)" --build-arg BUILDER_GID="$(id -g)" -t wraith-musl .
          docker run --rm --volume "$PWD:/work" --env TARGET --env WRAITH_RELEASE_TAG wraith-musl \
            bash -euo pipefail -c 'cargo build --release --locked -j 2 -p wraith-cli --target "$TARGET"; bash scripts/package-release.sh "$TARGET"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this job's swap
        if: always()
        run: |
          swapfile="$RUNNER_TEMP/wraith-release.swap"
          if test -f "$swapfile"; then
            if swapon --noheadings --show=NAME | grep -Fxq "$swapfile"; then sudo swapoff "$swapfile"; fi
            sudo rm -- "$swapfile"
          fi

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Require the complete release and create checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          for arch in amd64 arm64; do test -f "wraith_${VERSION}_${arch}.deb"; done
          for arch in x86_64 aarch64; do
            for libc in gnu musl; do test -f "wraith-${VERSION}-${arch}-unknown-linux-${libc}.tar.gz"; done
          done
          sha256sum -- *.deb *.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  publish-apt-repository:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      APT_SIGNING_KEY: ${{ secrets.WRAITH_APT_SIGNING_KEY }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify the published Debian packages
        run: |
          set -euo pipefail
          mkdir incoming
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern 'wraith_*.deb' --pattern SHA256SUMS.txt
          (cd incoming && sha256sum --ignore-missing --check SHA256SUMS.txt)
          test -f "incoming/wraith_${VERSION}_amd64.deb"
          test -f "incoming/wraith_${VERSION}_arm64.deb"
      - name: Build repository indexes and Release manifest
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils dpkg-dev gnupg
          bash scripts/build-apt-repository.sh --input incoming --output repository --version "$VERSION"
          install -m 0644 packaging/apt/wraith-archive-keyring.asc repository/wraith-archive-keyring.asc
          install -m 0644 packaging/apt/index.html repository/index.html
      - name: Sign repository metadata
        env:
          EXPECTED_FINGERPRINT: 8B71B4C422EF0171633845565D6B16E4201C32FB
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_KEY"
          keyhome=$(mktemp -d)
          chmod 700 "$keyhome"
          trap 'rm -rf -- "$keyhome"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --homedir "$keyhome" --import
          fingerprint=$(gpg --batch --homedir "$keyhome" --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --homedir "$keyhome" --local-user "$fingerprint" --clearsign \
            --output repository/dists/stable/InRelease repository/dists/stable/Release
          gpg --batch --yes --homedir "$keyhome" --local-user "$fingerprint" --detach-sign \
            --output repository/dists/stable/Release.gpg repository/dists/stable/Release
          verify_home=$(mktemp -d)
          chmod 700 "$verify_home"
          trap 'rm -rf -- "$keyhome" "$verify_home"' EXIT
          gpg --batch --homedir "$verify_home" --import packaging/apt/wraith-archive-keyring.asc
          gpgv --keyring "$verify_home/pubring.kbx" repository/dists/stable/InRelease
      - name: Validate signed APT installation path
        run: |
          bash scripts/verify-apt-repository.sh --repository repository \
            --keyring packaging/apt/wraith-archive-keyring.asc --version "$VERSION"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload repository artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: repository
      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
