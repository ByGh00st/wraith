name: E2E Kernel Integration Tests

on:
  push:
    branches: [ "main", "stabilization/**" ]
  pull_request:
    branches: [ "main", "stabilization/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-e2e:
    name: Live Linux Netfilter & Tor Sandbox
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tor \
            iptables \
            iproute2 \
            tcpdump \
            curl \
            dnsutils \
            jq \
            netcat-openbsd \
            e2fsprogs \
            python3

      - name: Compile Wraith Binary
        run: |
          cargo build --locked --release -p wraith-cli
          sudo cp target/release/wraith /usr/local/bin/wraith
          sudo chmod 755 /usr/local/bin/wraith
          wraith --version

      - name: Initialize Environment Directories
        run: |
          sudo mkdir -p /var/lib/wraith/tor /run/wraith-tor /var/log/wraith
          sudo chmod 700 /var/lib/wraith/tor /var/log/wraith
          sudo chmod +x tests/e2e/*.sh

      - name: Execute Network Namespace E2E Test Suite (7 Scenarios)
        env:
          WRAITH_TOR_BOOTSTRAP_TIMEOUT: "180"
        run: |
          sudo -E bash tests/e2e/harness.sh

      - name: Execute Native Wire SYN Audit (Kernel Namespace Isolated)
        run: |
          cargo test -p wraith-net --test live_wire_syn_audit --no-run
          TEST_BIN=$(find target/debug/deps -maxdepth 1 -name "live_wire_syn_audit-*" -type f -executable | head -n 1)
          sudo env "PATH=$PATH" "$TEST_BIN" --ignored --nocapture
