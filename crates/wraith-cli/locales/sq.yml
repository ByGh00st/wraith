help:
  desc: Wraith establishes fail-closed Tor transparent proxying with netfilter enforcement,
    TCP/IP stack normalization, hardware identifier rotation, and browser fingerprint
    sandboxing.
  usage: 'Usage: wraith [OPTIONS] [COMMAND]'
  commands_header: 'Commands:'
  cmd_start: Start Wraith network anonymization & kernel protection
  cmd_stop: Stop Wraith and restore normal network
  cmd_switch: Request new Tor exit identity (Newnym)
  cmd_test: Run comprehensive DNS, WebRTC, and IPv6 leak tests
  cmd_info: Display telemetry dashboard and active circuits
  cmd_dashboard: Launch interactive terminal telemetry dashboard (TUI)
  cmd_doctor: Run deep multi-tier kernel diagnostics auditor
  cmd_benchmark: Run high-performance cryptographic and kernel benchmarks
  cmd_cleanup: Perform anti-forensic RAM and log purge
  cmd_mac: Randomize network interface MAC address and hostname
  cmd_profile: Apply geographic Tor exit node profile
  cmd_pentest: Display offensive security & pentest tool sanitization guide (Nmap,
    Sqlmap, Ffuf)
  cmd_update: Fetch latest upstream updates and recompile binary in-place
  cmd_shred: Securely shred and overwrite a file using DoD 5220.22-M 7-pass standard
  cmd_monitor: Launch real-time dedicated DPI & IDS live interceptor monitor
  sec_net_header: 'Network Isolation Options:'
  opt_mac: Randomize network interface L2 MAC address and hostname
  opt_bridge: Route traffic through censorship-resistant obfs4 Tor bridges
  opt_namespace: Restrict routing to an isolated Linux Network Namespace (10.200.1.0/24)
  opt_profile: Enforce geographic Tor exit node profile (e.g. stealth, speed, research,
    darkweb)
  opt_jitter: Inject synthetic traffic cells & Poisson timing jitter to resist traffic
    flow correlation
  opt_rotate: Automatically rotate Tor exit node identity every N seconds (e.g. --rotate
    60)
  opt_no_ks: Disable the Fail-Closed KillSwitch watchdog monitor
  opt_wg: Encapsulate Tor traffic inside a kernel WireGuard tunnel (Multi-Hop DPI/ISP
    bypass)
  opt_spawn_monitor: Automatically spawn a dedicated real-time DPI & IDS monitor terminal
    window on startup
  sec_harden_header: 'System Hardening & Anti-Fingerprinting:'
  opt_browser_shield: Inject WebGL, Canvas, Audio, GPU, Font and Resolution anti-fingerprint
    profiles into browsers
  opt_font_sandbox: Restrict OS-level font discovery via Fontconfig sandbox
  opt_tcp_mask: Normalize TCP/IP L4 stack parameters (TTL=128, timestamps=0) to resist
    OS fingerprinting
  opt_machine_id: Rotate unique OS /etc/machine-id and system hardware identifiers
  opt_full_security: 'Engage ALL 16 defense layers: GPU/Font Shield, MAC, Machine-ID,
    TCP-Mask, Jitter, Seccomp, eBPF, RAMFS Vault'
  sec_forensic_header: 'High-Risk & Forensic Operations:'
  opt_wipe_logs: '⚠ IRREVERSIBLE: Eradicate system authentication logs, event logs,
    and user shell history files'
  opt_self_destruct: '⚠ IRREVERSIBLE: Cryptographically shred binary from disk and
    wipe memory artifacts on exit (SIGINT)'
  opt_masquerade: '⚠ EVASIVE: Spoof process name in Linux kernel scheduler as kernel
    worker thread ([kworker/u16:0])'
  opt_anti_debug: '⚠ EMERGENCY ABORT: Enforce anti-debugging probe; immediately triggers
    SIGKILL if attached to a debugger'
  opt_verbose: Enable verbose debug logging
  opt_lang: Override system language (e.g. 'en', 'tr', 'ru', 'de')
  shortcuts_header: 'Quick Operational Shortcuts:'
  cmd_cleanup_full: Thorough anti-forensic purge (wipes RAM, swap, and system auth
    logs)
  sec_general_header: 'General Options:'
  opt_select_lang: Launch interactive 65-language configuration terminal menu
  opt_help: Print this help screen
  opt_version: Print version
  examples_header: 'Operational Usage Scenarios:'
