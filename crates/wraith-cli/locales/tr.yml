help:
  desc: Wraith; sızıntı geçirmez (fail-closed) netfilter yönlendirmesi, TCP/IP yığın
    normalizasyonu, donanım kimliği rotasyonu ve tarayıcı parmak izi kum havuzlaması
    ile tam çekirdek anonimliği sağlar.
  usage: 'Kullanım: wraith [KISAYOLLAR | SEÇENEKLER] [KOMUT]'
  shortcuts_header: 'Hızlı Operasyonel Kısayollar:'
  commands_header: 'Kullanılabilir Alt Komutlar:'
  cmd_start: Anonimleştirmeyi ve çekirdek korumasını başlatır
