help:
  desc: Wraith plenam anonymitatem praebet per redirectionem Tor tutam, accommodationem
    TCP/IP et custodiam vestigiorum navigatoris.
  usage: 'Usus: wraith [COMPENDIA | OPTIONES] [IMPERIUM]'
  shortcuts_header: 'Compendia Celeria Operativa:'
  commands_header: 'Subimperia Praesto:'
  cmd_start: Incipe anonymitatem retis et tutelam nuclei
  cmd_stop: Siste anonymitatem et restitue rete ordinarium
  cmd_switch: Pete novam identitatem exitus Tor (Newnym)
  cmd_test: Exsequere probationes effluxionis DNS, WebRTC et IPv6
