  cmd_benchmark: Exsequere probationes celeritatis cryptographicae
  cmd_cleanup: Purgatio antiforensis memoriae RAM et actorum
  cmd_cleanup_full: Purgatio antiforensis profunda (RAM, swap et omnia acta)
  cmd_mac: Temere muta inscriptionem MAC et nomen computatri
  cmd_profile: Applicare schema geographicum exitus Tor
  cmd_pentest: Display DPI tool signature sanitization & Tor isolation guide (Nmap,
    Sqlmap, Ffuf)
  cmd_update: Extrahe novissimas emendationes ex GitHub et reconstrue
  cmd_shred: Dele tabulam secure secundum normam DoD 5220.22-M 7 vicibus
  cmd_monitor: Launch real-time AF_PACKET DPI signature interceptor & IDS monitor
  sec_net_header: 'Optiones Segregationis Retis et Cuniculorum:'
  opt_mac: Randomize network interface L2 MAC address and hostname
  opt_bridge: Route traffic through censorship-resistant obfs4 Tor bridges
  opt_namespace: Restrict routing to an isolated Linux Network Namespace (10.200.1.0/24)
  opt_profile: Enforce geographic Tor exit node profile (stealth, speed, research,
    darkweb)
  opt_jitter: Inject synthetic traffic cells & Poisson timing jitter to resist traffic
    flow correlation
  opt_rotate: Automatically rotate Tor exit node identity every N seconds (e.g. --rotate
    60)
  opt_no_ks: Disable the Fail-Closed KillSwitch watchdog monitor
  opt_wg: Encapsulate Tor traffic inside a kernel WireGuard tunnel (Multi-Hop DPI/ISP
    bypass)
  opt_spawn_monitor: Automatically spawn a dedicated real-time DPI & IDS monitor terminal
    window on startup
  sec_harden_header: 'Munimentum Systematis et Vestigiorum:'
  opt_browser_shield: Inject WebGL, Canvas, Audio, GPU, Font and Resolution anti-fingerprint
    profiles into browsers
  opt_font_sandbox: Restrict OS-level font discovery via Fontconfig sandbox
  opt_tcp_mask: Normalize TCP/IP L4 stack parameters (TTL=128, timestamps=0) to resist
    OS fingerprinting
  opt_machine_id: Rotate unique OS /etc/machine-id and system hardware identifiers
  opt_full_security: 'Engage ALL 16 defense layers: GPU/Font Shield, MAC, Machine-ID,
    TCP-Mask, Jitter, Seccomp, eBPF, RAMFS Vault'
  sec_forensic_header: 'Operationes Periculosae et Antiforenses:'
  opt_wipe_logs: '⚠ IRREVERSIBLE: Eradicate system authentication logs, event logs,
    and user shell history files'
  opt_self_destruct: '⚠ IRREVERSIBLE: Cryptographically shred binary from disk and
    wipe memory artifacts on exit (SIGINT)'
  opt_masquerade: '⚠ EVASIVE: Spoof process name in Linux kernel scheduler as kernel
    worker thread ([kworker/u16:0])'
  opt_anti_debug: '⚠ EMERGENCY ABORT: Enforce anti-debugging probe; immediately triggers
    SIGKILL if attached to a debugger'
  sec_general_header: 'Optiones Generales:'
  opt_verbose: Enable verbose debug logging
  opt_lang: Override system language (e.g. 'en', 'tr', 'ru', 'de')
  opt_select_lang: Aperi indicem terminalem 75 linguarum
  opt_help: Monstra hanc paginam auxilii
  opt_version: Monstra informationem versionis
  examples_header: 'Exempla Usus Operativi:'
  ex_fs: Launch with maximum 16-layer defense & DPI sanitization
  ex_stealth: Randomize MAC + Enforce stealth geographic exit nodes
  ex_wipe: Full defense + Eradicate all session & auth logs on exit
  ex_destruct: Full defense + Cryptographically shred binary on exit
  ex_stop: Terminate isolation & Restore clean clearnet
  ex_update: Pull latest release from GitHub & Hot-rebuild in-place
  opt_onion: 'Arm an Ephemeral v3 Onion Hidden Service forwarding <VIRT_PORT:TARGET_PORT>'
  opt_shaper: 'Enforce Linux TC/Netem kernel traffic shaping & jitter distribution (anti-flow correlation)'
  opt_honey_ports: 'Arm localhost deception honey-port traps on common lateral movement ports (2222, 3306, 5432, 6379, 8080, 27017)'
  opt_honey_lan: '🚨 LAN SENSOR MODE: Bind honeypot traps to 0.0.0.0 (Exposes decoy ports to Wi-Fi/LAN scanners & tarpits them)'
