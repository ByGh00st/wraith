commands:
  cmd_step_0: Anti-hata ayıklama tuzağı devrede [AÇIK ONAYLI]
  cmd_step_1: Donanım L2 MAC adresi rastgeleleştiriliyor...
  cmd_step_2: Sansür atlatıcı obfs4 köprüleri yapılandırılıyor...
  cmd_step_3: Optimize edilmiş torrc dosyası oluşturuluyor...
  cmd_step_4: Tor yapılandırması devrede
  cmd_step_5: Tor motoru başlatılıyor...
  cmd_step_6: Tor motoru aktif & ControlPort (9051) üzerinde doğrulandı
  cmd_step_7: Yerel Tor şeffaf DNS (transparent DNS) yapılandırılıyor...
  cmd_step_8: DNS 127.0.0.1 adresine bağlandı (Tor Port 5353)
  cmd_step_9: Hata-Kapalı (Fail-Closed) güvenlik duvarı kuralları zorlanıyor...
  cmd_step_10: Tüm sistem TCP/DNS trafiği Tor ağına zorlandı
  cmd_step_11: IPv6 çift yığınlı (dual-stack) saldırı yüzeyi yok ediliyor...
  cmd_step_12: IPv6 çekirdek seviyesi düşürme (drop) devrede
  cmd_step_13: STUN/TURN WebRTC sızıntı portları engelleniyor...
  cmd_step_14: STUN/TURN portları engellendi
  cmd_step_15: eBPF TC Egress Fastpath bağlandı
  cmd_step_16: Sistem seviyesi font koruması (sandbox) aktif
  cmd_step_17: cgroup2 ağ soketi hapishanesi aktif
  cmd_step_18: İzole edilmiş Linux Ağ Alanı (Network Namespace) oluşturuluyor...
  cmd_step_19: Süreç ağ alanı hapishanesi devrede (10.200.1.0/24)
  cmd_step_20: Çıkış kimliği ve coğrafi konum doğrulanıyor...
  cmd_step_21: Asenkron Hata-Kapalı (Fail-Closed) bekçisi devrede...
  cmd_step_22: Açık ağ (clearnet) DNS çözücüleri kilitleri açılıyor ve geri yükleniyor...
  cmd_step_23: DNS kilitleri açıldı ve açık ağa (clearnet) yönlendirildi
  cmd_step_24: Netfilter güvenlik duvarı kuralları temizleniyor & varsayılan ACCEPT
    ayarlarına dönülüyor...
  cmd_step_25: Güvenlik duvarı varsayılan ACCEPT (kabul) durumuna sıfırlandı
  cmd_step_26: Tor motoru sonlandırılıyor...
  cmd_step_27: Tor motoru çevrimdışı
  cmd_step_28: Donanım MAC adresi geri yükleniyor...
  cmd_step_29: Donanım MAC adresi geri yüklendi
  cmd_step_30: Cihaz adı (Hostname) geri yüklendi
  cmd_step_31: Orijinal İşletim Sistemi makine kimliği (machine-id) geri yükleniyor...
  cmd_step_32: Makine Kimliği (Machine-ID) geri yüklendi
  cmd_step_33: Varsayılan TCP/IP yığın parametreleri geri yükleniyor...
  cmd_step_34: TCP/IP yığını geri yüklendi
  cmd_step_35: Ağ alanı (Network namespace) yıkılıyor...
  cmd_step_36: Ağ alanı temizlendi
  cmd_step_37: Donanım ve font kalkanı kaldırılıyor (eğer aktifse)...
  cmd_step_38: Tarayıcı profilleri ve font yapılandırması geri alındı
  cmd_step_39: Ağ arayüzleri ve bağlantı (carrier) yeniden onaylanıyor...
  cmd_step_40: Ağ & DNS çözümlemesi güncelleme için hazırlanıyor...
  cmd_step_41: Temiz depo kopyası (repository snapshot) başarıyla klonlandı
  cmd_step_42: Sürüm dosyası (Release binary) derlemesi başarıyla tamamlandı
  cmd_step_43: Derleme tamamlandı ancak hedef ikili dosya (binary) bulunamadı
  cmd_step_44: Yeni Tor çıkış devresi isteniyor (SIGNAL NEWNYM)...
  cmd_step_45: Çoklu vektör sızıntı doğrulama testi başlatılıyor...
help:
  desc: "Wraith; hata-kapalı (fail-closed) netfilter yönlendirmesi, TCP/IP yığın normalizasyonu, donanım kimliği rotasyonu ve tarayıcı parmak izi kum havuzlaması ile tam anonimlik sağlar."
  usage: "Kullanım: wraith [SEÇENEKLER] [KOMUT]"
  commands_header: "Komutlar:"
  cmd_start: "Anonimleştirmeyi ve çekirdek korumasını başlatır"
  cmd_stop: "Anonimleştirmeyi durdurur ve normal ağı geri yükler"
  cmd_switch: "Yeni bir Tor çıkış kimliği (Newnym) talep eder"
  cmd_test: "Kapsamlı DNS, WebRTC ve IPv6 sızıntı testlerini çalıştırır"
  cmd_info: "Canlı telemetri paneli ve aktif devre durumunu gösterir"
  cmd_dashboard: "İnteraktif terminal telemetri kontrol panelini (TUI) başlatır"
  cmd_doctor: "Derin çekirdek ve ağ bütünlüğü tanılama testlerini çalıştırır"
  cmd_benchmark: "Yüksek performanslı kriptografik ve çekirdek hız testlerini çalıştırır"
  cmd_cleanup: "Adli bilişim karşıtı RAM ve log temizliği yapar"
  cmd_mac: "Ağ kartı MAC adresini ve sistem hostname değerini rastgeleleştirir"
  cmd_profile: "Coğrafi Tor çıkış profili uygular (örn: stealth, speed, research, darkweb)"
  cmd_pentest: "Sızma testi araçları için izolasyon rehberini gösterir (Nmap, Sqlmap, Ffuf)"
  cmd_update: "En son güncellemeleri GitHub'dan çeker ve yerinde yeniden derler"
  cmd_shred: "Bir dosyayı DoD 5220.22-M 7-geçişli standart ile güvenle parçalar"
  cmd_monitor: "Gerçek zamanlı DPI ve IDS canlı ağ izleme panelini açar"
  
  sec_net_header: "Ağ İzolasyonu Seçenekleri:"
  opt_mac: "Ağ kartı L2 MAC adresini ve hostname değerini rastgeleleştirir"
  opt_bridge: "Trafiği sansüre dayanıklı obfs4 Tor köprüleri üzerinden yönlendirir"
  opt_namespace: "İzole bir Linux Network Namespace (10.200.1.0/24) içine kilitler"
  opt_profile: "Coğrafi Tor çıkış profili zorlar (örn: stealth, speed, research, darkweb)"
  opt_jitter: "Trafik akış korelasyonuna karşı Poisson zamanlama gecikmesi ve sahte paketler enjekte eder"
  opt_rotate: "Tor çıkış kimliğini her N saniyede bir otomatik döndürür (örn: --rotate 60)"
  opt_no_ks: "Fail-Closed KillSwitch bekçisini devre dışı bırakır"
  opt_wg: "Tor trafiğini WireGuard tüneli içine kapsüller (Çok Katmanlı Hibrit Tünel)"
  opt_spawn_monitor: "Başlangıçta otomatik gerçek zamanlı DPI/IDS izleme penceresi açar"

  sec_harden_header: "Sistem ve Parmak İzi Sıkılaştırma:"
  opt_browser_shield: "WebGL, Canvas, Audio, GPU, Font ve Çözünürlük parmak izi korumasını tarayıcılara enjekte eder"
  opt_font_sandbox: "İşletim sistemi yazı tiplerini kum havuzuna alır (Fontconfig jail)"
  opt_tcp_mask: "TCP/IP L4 yığın parametrelerini (TTL=128, timestamps=0) Windows standardına normalleştirir"
  opt_machine_id: "OS /etc/machine-id ve donanım kimliklerini rastgeleleştirir"
  opt_full_security: "TÜM 16 güvenlik katmanını kilitler (Maksimum Sıkılaştırma Modu)"

  sec_forensic_header: "Yüksek Riskli & Adli Bilişim Karşıtı Operasyonlar:"
  opt_wipe_logs: "⚠ GERİ ALINAMAZ: Sistem oturum loglarını, olay günlüklerini ve kabuk geçmişini siler"
  opt_self_destruct: "⚠ GERİ ALINAMAZ: Kapanışta (Ctrl+C) ikiliyi diskten kalıcı olarak siler ve hafızayı temizler"
  opt_masquerade: "⚠ ALDATICI: Linux çekirdeğinde süreç adını [kworker/u16:0] olarak maskeler"
  opt_anti_debug: "⚠ ACİL İPTAL: Hata ayıklayıcı (debugger/ptrace) takılırsa süreci anında öldürür"

  opt_verbose: "Ayrıntılı hata ayıklama (debug) günlüklerini açar"
  opt_lang: "Sistem dilini geçici olarak değiştirir (örn: 'en', 'tr', 'ru', 'de')"
